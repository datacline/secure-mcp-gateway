name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example: v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --workspace @datacline/smcp --include-workspace-root

      - run: npm run build --workspace @datacline/smcp

      - run: npm test --workspace @datacline/smcp

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
            TAG="$(printf '%s' "$RAW_TAG" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s#^refs/tags/##')"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Verify tag matches package.json version
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          VERSION=$(node -e "console.log(require('./packages/smcp/package.json').version)")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Error: tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          echo "✓ Tag version matches package.json"

      - name: Verify package contents
        run: |
          PACK_JSON=$(npm pack --dry-run --json --workspace @datacline/smcp)
          node -e '
            const pack = JSON.parse(process.argv[1]);
            const files = new Set((pack[0]?.files ?? []).map((file) => file.path));

            const requiredFiles = [
              "dist/smcp.cjs",
              "dist/smcp.mjs",
            ];

            const forbiddenPatterns = [
              /^src\//,
              /^test\//,
              /^tests\//,
              /^scripts\//,
              /^\.github\//,
              /(^|\/)tsconfig(\.[^/]+)?\.json$/,
              /(^|\/)(vite|vitest|jest|eslint|prettier|rollup)\.config\.[^/]+$/,
            ];

            const missing = requiredFiles.filter((file) => !files.has(file));
            const forbidden = [...files].filter((file) =>
              forbiddenPatterns.some((pattern) => pattern.test(file))
            );

            if (missing.length > 0 || forbidden.length > 0) {
              if (missing.length > 0) {
                console.error("Missing required package files:");
                for (const file of missing) console.error("  - " + file);
              }
              if (forbidden.length > 0) {
                console.error("Forbidden files included in package:");
                for (const file of forbidden) console.error("  - " + file);
              }
              process.exit(1);
            }

            console.log("✓ Package contents verified");
          ' "$PACK_JSON"

      - name: Determine npm dist-tag from version
        id: dist_tag
        run: |
          VERSION=$(node -e "console.log(require('./packages/smcp/package.json').version)")
          # Detect prerelease (anything with a hyphen: 1.0.0-alpha.1, 1.0.0-beta.2, ...)
          if [[ "$VERSION" == *-* ]]; then
            # Use the prerelease label as the dist-tag (alpha/beta/rc/next)
            TAG=$(echo "$VERSION" | sed -E 's/.*-([a-zA-Z]+)\..*/\1/')
            [ -z "$TAG" ] && TAG=next
          else
            TAG=latest
          fi
          echo "Resolved dist-tag: $TAG (from version $VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --workspace @datacline/smcp --access public --provenance --tag "${{ steps.dist_tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release if missing
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists for $TAG"
          else
            gh release create "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
